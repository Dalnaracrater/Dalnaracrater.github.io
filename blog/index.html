---
layout: blog
title: blog
---

<header class="masthead">
  <h1 class="name">{{ site.blog_name | default: "Blog" }}</h1>
</header>
{%- if site.blog_description %}
<p class="blog-sub">{{ site.blog_description }}</p>
{%- endif %}

<div class="post-list">
  {%- for post in site.posts %}
  {% include blog_post_row.html post=post %}
  {%- endfor %}
</div>
